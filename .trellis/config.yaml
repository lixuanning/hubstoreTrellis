# Trellis 配置文件 — storehub Monorepo 项目
# 项目级别的 Trellis 工作流配置。所有配置项都有默认值，只覆盖需要改的。
#
# 核心概念：
# - Session Recording：开发会话日志（journal），记录每次开发的上下文
# - Task Lifecycle：任务生命周期（create → start → finish → archive）
# - Monorepo Packages：4 个独立 git 子仓库的声明
# - Channel Worker：多 agent 协作时的并发控制
#
# All values have sensible defaults. Only override what you need.

#-------------------------------------------------------------------------------
# Session Recording — 开发会话记录
# 每次编码会话自动记录到 .trellis/workspace/<developer>/journal-*.md
#-------------------------------------------------------------------------------

# 自动提交 journal/index 变动时使用的 commit message
session_commit_message: "chore: record journal"

# 单个 journal 文件最大行数，超过后自动滚动到新文件
max_journal_lines: 2000

#-------------------------------------------------------------------------------
# Session Auto-Commit — 自动提交行为
# 控制 add_session.py / task.py archive 是否自动 git commit
# false = 只写文件不 commit，由你手动决定是否提交
#-------------------------------------------------------------------------------
# session_auto_commit: true

#-------------------------------------------------------------------------------
# Task Lifecycle Hooks — 任务生命周期钩子
# 任务事件（创建/开始/完成/归档）后自动执行的 shell 命令。
# 钩子失败只打印警告，不阻塞主流程。
#-------------------------------------------------------------------------------
#
# hooks:
#   after_create:
#     - "echo 'Task created'"
#   after_start:
#     - "echo 'Task started'"
#   after_finish:
#     - "echo 'Task finished'"
#   after_archive:
#     - "echo 'Task archived'"

#-------------------------------------------------------------------------------
# Monorepo / Packages — 多仓库声明
# 声明项目包含的子仓库。`git: true` 表示该目录有独立的 .git 仓，
# Trellis 会在 git 操作时把它当作独立仓库处理。
#-------------------------------------------------------------------------------
#
# packages:
#   frontend:
#     path: packages/frontend
#   backend:
#     path: packages/backend
#   docs:
#     path: docs-site
#     type: submodule
#   # For polyrepo / meta-repo layouts (independent .git in each subdir),
#   # mark the package with `git: true`. The runtime treats it as an
#   # independent repository for things like git-context display.
#   webapp:
#     path: ./webapp
#     git: true

# Default package used when --package is not specified.
# default_package: frontend

#-------------------------------------------------------------------------------
# Channel worker OOM guard — 并发 worker 管控
# trellis channel spawn 的 worker 数量和空闲超时控制，防止 OOM。
# idle_timeout: 0 = 不自动回收空闲 worker
# max_live_workers: 0 = 不限制并发 worker 数量
#-------------------------------------------------------------------------------
#
channel:
  worker_guard:
    idle_timeout: 5m
    max_live_workers: 6
  # trusted_context_dirs:
  #   - /work/user/trellis_workspace
  # auto_trust_trellis_symlinks: false

#-------------------------------------------------------------------------------
# Codex — 子 agent 调度模式
# "auto": 实现/检查/研究任务用子 agent 执行（推荐）
# "inline": 全部在主会话中执行（调试用）
#-------------------------------------------------------------------------------
#
# codex:
#   dispatch_mode: auto  # or "inline"; legacy alias: "sub-agent"

#-------------------------------------------------------------------------------
# Sub-agent context injection limits
#-------------------------------------------------------------------------------
# Caps how much task context (implement.jsonl / check.jsonl referenced files,
# plus prd.md / design.md / implement.md) gets inlined into a sub-agent's
# first prompt. Oversized files are truncated with a notice; once the total
# payload cap is reached, remaining files degrade to index lines (path +
# reason + size) instead of being inlined.
#
# All values are byte counts. `0` disables the corresponding limit.
#
# context_injection:
#   max_file_bytes: 32768        # per implement.jsonl / check.jsonl referenced file
#   max_artifact_bytes: 65536    # per task artifact (prd.md / design.md / implement.md)
#   max_total_bytes: 131072      # whole injected payload; overflow degrades to index lines

#-------------------------------------------------------------------------------
# Per-turn prompt injection
#-------------------------------------------------------------------------------
# Escape hatch for the per-turn <workflow-state> breadcrumb. When a user
# prompt contains the skip keyword as a standalone word (case-insensitive,
# word-boundary match — "no-trellisfoo" does NOT count), the breadcrumb is
# skipped for that turn only. Does not affect SessionStart or sub-agent
# context injection.
#
# prompt_injection:
#   skip_keyword: "no-trellis"   # "" disables the escape hatch entirely

# 本项目 4 个子仓库声明（由 trellis init 自动检测，手动修正后保留）
# 每个都是独立的 git 仓库（git: true），Trellis 不跨仓操作
packages:
  ai-store-api:           # NestJS 后端服务（:3000）
    path: ai-store-api
    git: true
  storehub-servless:      # Node 中间件/代理层（:3001）
    path: storehub-servless
    git: true
  storehub-uniapp:        # UniApp 企业微信小程序 + H5
    path: storehub-uniapp
    git: true
  storehub-web:           # Vue3 H5 子应用（webview 嵌入）
    path: storehub-web
    git: true
default_package: ai-store-api
